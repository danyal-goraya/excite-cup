services:
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
    restart: always
  node-exporter:
    image: prom/node-exporter
    ports: ["9100:9100"]
    restart: always
  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    restart: always
