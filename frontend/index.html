<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excite Cup 2026</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Segoe UI,Arial,sans-serif;background:#0b1020;color:#eef1f7}
  header{background:linear-gradient(135deg,#ff6a00,#ee0979);padding:70px 20px;text-align:center}
  header h1{font-size:3.2rem;letter-spacing:3px}
  header p{margin-top:10px;font-size:1.2rem}
  .badge{display:inline-block;margin-top:18px;background:#0b1020;padding:8px 18px;border-radius:30px;font-weight:bold}
  main{max-width:1000px;margin:auto;padding:30px 20px}
  h2{margin:30px 0 15px;color:#ff9a3c}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:#151c35;border-radius:12px;padding:18px;border-left:5px solid #ff6a00}
  .card h3{margin-bottom:6px}
  .card small{color:#9aa4c4;display:block;margin-top:3px}
  .tag{background:#ff6a00;color:#fff;padding:2px 10px;border-radius:10px;font-size:.75rem}
  form{background:#151c35;padding:20px;border-radius:12px;display:grid;gap:12px}
  input,select,button{padding:12px;border-radius:8px;border:none;font-size:1rem}
  button{background:#ff6a00;color:#fff;font-weight:bold;cursor:pointer}
  button:hover{background:#ee0979}
  ul{list-style:none}
  li{background:#151c35;margin-bottom:8px;padding:10px 14px;border-radius:8px}
  footer{text-align:center;padding:25px;color:#7c86a8}
</style>
</head>
<body>
<header>
  <h1>EXCITE CUP 2026</h1>
  <p>The Biggest Inter-Department Sports, Tech &amp; Culture Festival</p>
  <span class="badge">12 - 17 November 2026</span>
</header>
<main>
  <h2>Events</h2>
  <div class="grid" id="events"></div>

  <h2>Register Now</h2>
  <form id="regForm">
    <select id="event" required></select>
    <input id="name" placeholder="Your name" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="team" placeholder="Team / Department (optional)">
    <button type="submit">Register</button>
    <div id="msg"></div>
  </form>

  <h2>Latest Registrations</h2>
  <ul id="regs"></ul>
</main>
<footer>Excite Cup 2026 &middot; Three-tier app deployed via Jenkins &amp; Kubernetes</footer>
<script>
async function loadEvents(){
  const ev = await (await fetch('/api/events')).json();
  document.getElementById('events').innerHTML = ev.map(e =>
    `<div class="card"><span class="tag">${e.category}</span><h3>${e.name}</h3>
     <small>📍 ${e.venue}</small><small>📅 ${e.event_date}</small></div>`).join('');
  document.getElementById('event').innerHTML = ev.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
}
async function loadRegs(){
  const r = await (await fetch('/api/registrations')).json();
  document.getElementById('regs').innerHTML = r.map(x => `<li><b>${x.name}</b> (${x.team}) → ${x.event}</li>`).join('') || '<li>No registrations yet</li>';
}
document.getElementById('regForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const res = await fetch('/api/register', {method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({event_id:document.getElementById('event').value,
      name:document.getElementById('name').value,email:document.getElementById('email').value,
      team:document.getElementById('team').value})});
  document.getElementById('msg').textContent = res.ok ? '✅ Registered successfully!' : '❌ Failed';
  ev.target.reset(); loadRegs();
});
loadEvents(); loadRegs();
</script>
</body>
</html>
